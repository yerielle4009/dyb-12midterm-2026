<meta charset="UTF-8" />

<title>DYB 2학기 중간고사 내신 안내</title>
<style>
:root{
  --navy:#8F1017;
  --blue:#D71920;
  --light:#F5F8FC;
  --line:#DCE5EF;
  --text:#1F2937;
  --muted:#64748B;
  --white:#FFFFFF;
  --accent:#FDECEE;
  --warn:#FFF5E8;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;background:var(--light);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),#D71920);color:#fff;padding:38px 20px 32px}
.header-inner{max-width:1080px;margin:0 auto}
.brand{font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.82;margin-bottom:8px}
h1{font-size:30px;margin:0 0 8px;font-weight:800}
.subtitle{font-size:15px;opacity:.88;margin:0}
main{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
.search-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(15,23,42,.05);margin-top:-16px;position:relative}
.search{width:100%;border:0;outline:none;font-size:16px;padding:10px 12px;border-radius:10px;background:#F8FAFC}
.section-title{font-size:18px;font-weight:800;margin:28px 0 14px}
.school-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.school-btn{border:1px solid var(--line);background:#fff;padding:18px 12px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;min-height:62px}
.school-btn:hover{transform:translateY(-2px);border-color:#F2A7AC;box-shadow:0 8px 18px rgba(215,25,32,.10)}
.school-btn .date{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}
.empty{display:none;padding:40px 10px;text-align:center;color:var(--muted)}
.detail{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:28px;overflow:hidden;box-shadow:0 8px 26px rgba(15,23,42,.05)}
.detail.active{display:block}
.detail-head{padding:24px;background:#FBFDFF;border-bottom:1px solid var(--line);display:flex;gap:16px;justify-content:space-between;align-items:flex-start}
.detail-title{font-size:24px;font-weight:800;margin:0 0 8px}
.meta{font-size:14px;color:var(--muted)}
.back{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:700}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;overflow:auto}
.tab{padding:15px 18px;border:0;background:transparent;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.panel{display:none;padding:24px}.panel.active{display:block}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;background:#fff}
.card h3{font-size:16px;margin:0 0 10px}.card p{margin:7px 0;line-height:1.7;font-size:14px}
.badge{display:inline-block;background:var(--accent);color:var(--blue);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:12px}
.notice{background:var(--warn);border:1px solid #F4D7AA;padding:14px;border-radius:12px;font-size:13px;line-height:1.6}
.edit-tip{font-size:12px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.image-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.school-image{display:block;width:100%;height:auto}.image-placeholder{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;background:#F8FAFC;color:var(--muted)}.image-placeholder strong{font-size:17px;color:var(--text);margin-bottom:8px}.image-caption{padding:12px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:#fff}
.class-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.class-row{display:grid;grid-template-columns:90px 1fr 1.25fr;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff}.class-type{font-weight:900;color:var(--blue)}.class-room{font-weight:800}.class-teacher{font-weight:700}.pending{color:var(--muted)}
@media(max-width:560px){.class-row{grid-template-columns:72px 1fr;gap:6px 10px}.class-teacher{grid-column:2}.class-room{font-size:14px}.class-teacher{font-size:14px}}
@media(max-width:800px){.school-grid{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}.detail-head{flex-direction:column}.back{align-self:flex-end;margin-top:-46px}}
@media(max-width:420px){.school-grid{grid-template-columns:1fr 1fr;gap:9px}.school-btn{padding:14px 8px;font-size:14px}.panel{padding:18px}.tab{padding:14px 13px}}
</style>
</head>

<header>
  <div class="header-inner">
    <div class="brand">DYB · DAECHI M1</div>
    <h1>2026년 2학기 중간고사 내신 안내</h1>
    <p class="subtitle">학교명을 선택하면 시험 일정, 내신 안내문, 숙제장을 확인할 수 있습니다.</p>
  </div>
</header>
<main>
  <div class="search-wrap">

  </div>

  <div id="listSection">
    <div class="section-title">학교 선택</div>
    <div id="schoolGrid" class="school-grid"></div>
    <div id="empty" class="empty">검색 결과가 없습니다.</div>
  </div>

  <section id="detail" class="detail">
    <div class="detail-head">
      <div>
        <h2 id="detailTitle" class="detail-title"></h2>
        <div id="detailMeta" class="meta"></div>
      </div>
      <button class="back" onclick="backToList()">← 학교 목록</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="schedule">시험 일정</button>
      <button class="tab" data-tab="classes">수업 안내</button>
      <button class="tab" data-tab="notice">내신 안내문</button>
      <button class="tab" data-tab="homework">숙제장</button>
    </div>
    <div id="schedule" class="panel active"></div>
    <div id="classes" class="panel"></div>
    <div id="notice" class="panel"></div>
    <div id="homework" class="panel"></div>
  </section>
</main>

function renderImagePanel(schoolName, label, src, alt){
  if(src){
    return `
      <div class="image-wrap">
        <img class="school-image" src="${src}" alt="${alt}">
        <div class="image-caption">${schoolName} · ${label}</div>
      </div>`;
  }
  return `
    <div class="image-wrap">
      <div class="image-placeholder">
        <strong>${schoolName} ${label}</strong>
        <span>이미지 준비 중입니다.</span>
      </div>
    </div>`;
}

const grid = document.getElementById('schoolGrid');

function renderSchools(filter=''){
  grid.innerHTML='';
  const q = filter.trim().toLowerCase();
  const filtered = schools.filter(s => s.name.toLowerCase().includes(q));
  filtered.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='school-btn';
    btn.innerHTML=`${s.name}<span class="date">${s.exam}</span>`;
    btn.onclick=()=>openSchool(s);
    grid.appendChild(btn);
  });
  empty.style.display = filtered.length ? 'none' : 'block';
}

function openSchool(s){
  document.getElementById('listSection').style.display='none';
  const detail=document.getElementById('detail');
  detail.classList.add('active');
  document.getElementById('detailTitle').textContent=s.name;
  document.getElementById('detailMeta').textContent=`2026년 2학기 · 시험 일정: ${s.exam}`;

  const noMidterm = s.exam.includes('중간고사 없음');
  document.getElementById('schedule').innerHTML=`
    <div class="card">
      <span class="badge">시험 일정</span>
      <h3>${s.name}</h3>
      <p><strong>중간고사:</strong> ${s.exam}</p>
      <p><strong>내신 대비 시작:</strong> 8월 31일</p>
    </div>
    ${noMidterm ? `<div class="notice">※ 중간고사가 없는 학교도 기말고사에 앞선 학습 범위가 포함될 수 있어, 다른 학교와 함께 해당 범위를 미리 내신형으로 학습합니다.</div>` : ''}
  `;

  const rows = classInfo[s.name] || [];
  document.getElementById('classes').innerHTML = rows.length ? `
    <div class="card">
      <span class="badge">담당 선생님 · 강의실</span>
      <h3>${s.name} 내신 수업 안내</h3>
      <div class="class-list">
        ${rows.map(r=>`<div class="class-row"><div class="class-type">${r[0]}</div><div class="class-room">강의실 ${r[1]}</div><div class="class-teacher ${r[2].includes('확인 중')?'pending':''}">${r[2]}</div></div>`).join('')}
      </div>
    </div>` : `
    <div class="card">
      <span class="badge">담당 선생님 · 강의실</span>
      <h3>${s.name} 내신 수업 안내</h3>
      <p class="pending">담당 반 정보를 확인 중입니다.</p>
    </div>`;

  const imgs = schoolImages[s.name] || {};
  if (s.name === '대원국제중학교') {
    document.getElementById('notice').innerHTML = `
      <div class="image-wrap"><div class="image-placeholder"><strong>${s.name}</strong><span>일정 확인 중</span></div></div>`;
  } else {
    document.getElementById('notice').innerHTML = renderImagePanel(
      s.name,
      '내신 안내문',
      imgs.notice,
      `${s.name} 내신 안내문 이미지`
    );
  }

  document.getElementById('homework').innerHTML = renderImagePanel(
    s.name,
    '숙제장',
    imgs.homework,
    `${s.name} 숙제장 이미지`
  );
  setTab('schedule');
  window.scrollTo({top:0,behavior:'smooth'});
}

function backToList(){
  document.getElementById('detail').classList.remove('active');
  document.getElementById('listSection').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function setTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setTab(t.dataset.tab)));
search.addEventListener('input',e=>renderSchools(e.target.value));
renderSchools();
</script>
</body>
</html>
